<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Grade 12 Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 450px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            margin-top: 20px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .signup {
            margin-top: 20px;
            text-align: center;
        }

        .signup a {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🎓 Grade 12 Hub</h1>

        <h2 style="text-align:center;">Welcome Back 👋</h2>

        <p>Login to continue to your Grade 12 Hub.</p>

        <form id="loginForm">

            <label for="email">
                📧 Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                🔐 Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                🔓 Login
            </button>

        </form>

        <div id="message"></div>

        <div class="signup">
            Don't have an account?
            <a href="signup.html">
                Create Account
            </a>
        </div>

        <a class="back" href="index.html">
            ← Back to Grade 12 Hub
        </a>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://hdlhhbnawltisszzsbvw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Z3kWBySaIHiFDJdIGFhC_Q_a9SPPRlK";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const message =
            document
                .getElementById("message");

        message.textContent =
            "⏳ Logging in...";

        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                throw error;
            }

            message.textContent =
                "✅ Login successful!";

            setTimeout(function() {

                window.location.href =
                    "index.html";

            }, 500);

        } catch (error) {

            console.error(error);

            message.textContent =
                "❌ " + error.message;
        }

    });

</script>

</body>

</html>
