<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grade 12 Hub - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #173b73;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    .container {
      max-width: 500px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      background: #173b73;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0f2b55;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .link {
      text-align: center;
      margin-top: 20px;
    }

    .link a {
      color: #173b73;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>Grade 12 Hub</h1>
  <p>Welcome back</p>
</header>

<div class="container">
  <div class="card">

    <h2>Login</h2>

    <form id="loginForm">

      <label for="email">Email *</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password *</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Login
      </button>

      <div id="message"></div>

    </form>

    <div class="link">
      Don't have an account?
      <a href="index.html">Create Account</a>
    </div>

  </div>
</div>

<script>
  // ==========================================
  // SUPABASE SETTINGS
  // ==========================================

  const SUPABASE_URL = "https://hdlhhbnawltisszzsbvw.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Z3kWBySaIHiFDJdIGFhC_Q_a9SPPRlK";

  // ==========================================
  // SUPABASE CLIENT
  // ==========================================

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  // ==========================================
  // LOGIN
  // ==========================================

  const loginForm =
    document.getElementById("loginForm");

  const message =
    document.getElementById("message");

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      message.textContent =
        "Logging in...";

      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });

        if (error) {

          message.textContent =
            error.message;

          return;
        }

        if (data.user) {

          message.textContent =
            "Login successful!";

          setTimeout(function() {

            window.location.href =
              "home.html";

          }, 700);

        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Something went wrong. Please try again.";
      }

    }
  );
</script>

</body>
</html>
