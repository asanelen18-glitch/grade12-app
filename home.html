<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grade 12 Hub - Home</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #173b73;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    .welcome {
      text-align: center;
      padding: 25px 15px;
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    #userEmail {
      color: #555;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 15px;

      max-width: 700px;

      margin: auto;

      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px 15px;
      border-radius: 15px;
      text-align: center;
      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.1);
    }

    .card h3 {
      color: #173b73;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 14px;
      color: #555;
    }

    .logout {
      display: block;
      width: 200px;
      margin: 20px auto 40px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #173b73;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    @media (max-width: 500px) {

      .grid {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>

<body>

<header>
  <h1>Grade 12 Hub</h1>
  <p>Learn • Prepare • Succeed</p>
</header>

<div class="welcome">

  <h2>
    Welcome to Grade 12 Hub 🎓
  </h2>

  <p id="userEmail">
    Loading account...
  </p>

</div>

<div class="grid">

  <div class="card">
    <h3>📚 Past Papers</h3>
    <p>
      Access Grade 12 past question papers.
    </p>
  </div>

  <div class="card">
    <h3>📝 Notes</h3>
    <p>
      Study notes and learning material.
    </p>
  </div>

  <div class="card">
    <h3>💪 Motivation</h3>
    <p>
      Stay motivated throughout Grade 12.
    </p>
  </div>

  <div class="card">
    <h3>🎓 University</h3>
    <p>
      Find useful university application information.
    </p>
  </div>

</div>

<button
  class="logout"
  id="logoutButton">
  Logout
</button>

<script>

  // ==========================================
  // SUPABASE SETTINGS
  // ==========================================

  const SUPABASE_URL =
    "https://hdlhhbnawltisszzsbvw.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Z3kWBySaIHiFDJdIGFhC_Q_a9SPPRlK";

  // ==========================================
  // SUPABASE CLIENT
  // ==========================================

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

  // ==========================================
  // CHECK LOGIN
  // ==========================================

  async function checkUser() {

    const { data, error } =
      await supabaseClient.auth.getUser();

    if (error || !data.user) {

      window.location.href =
        "login.html";

      return;
    }

    document.getElementById(
      "userEmail"
    ).textContent =
      "Logged in as: " + data.user.email;
  }

  checkUser();

  // ==========================================
  // LOGOUT
  // ==========================================

  document.getElementById(
    "logoutButton"
  ).addEventListener(
    "click",
    async function() {

      const { error } =
        await supabaseClient.auth.signOut();

      if (error) {

        alert(error.message);

        return;
      }

      window.location.href =
        "login.html";
    }
  );

</script>

</body>
</html>
