<html lang="en">

            background: #4f46e5;

        .welcome h2 {

        }

        .cards {

            margin-bottom: 10px;

        }

            margin-bottom: 18px;
            line-height: 1.5;
        }

            border-radius: 8px;
            font-weight: bold;
        }

            background: #3730a3;
