<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 12 Hub - Create Account</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #173b73;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    .container {
      max-width: 500px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: bold;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .terms {
      margin-top: 15px;
      font-size: 14px;
    }

    .terms label {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-weight: normal;
    }

    .terms input {
      margin-top: 3px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      background: #173b73;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0f2b55;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .link {
      text-align: center;
      margin-top: 20px;
    }

    .link a {
      color: #173b73;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>Grade 12 Hub</h1>
  <p>Your Grade 12 study platform</p>
</header>

<div class="container">
  <div class="card">

    <h2>Create Account</h2>

    <form id="signupForm">

      <label for="email">Email *</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password *</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm Password *</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="6"
        required
      >

      <div class="terms">
        <label>
          <input type="checkbox" id="terms" required>
          <span>I agree to the Grade 12 Hub Terms & Community Rules.</span>
        </label>
      </div>

      <button type="submit">Create Account</button>

      <div id="message"></div>

    </form>

    <div class="link">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>
</div>

<script>
  // ==========================================
  // SUPABASE SETTINGS
  // ==========================================

  const SUPABASE_URL = "https://hdlhhbnawltisszzsbvw.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Z3kWBySaIHiFDJdIGFhC_Q_a9SPPRlK";

  // ==========================================
  // EMAIL REDIRECT
  // ==========================================

  const EMAIL_REDIRECT_URL =
    "https://asanelen18-glitch.github.io/grade12-app/login.html";

  // ==========================================
  // CREATE SUPABASE CLIENT
  // ==========================================

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  // ==========================================
  // CREATE ACCOUNT
  // ==========================================

  const signupForm = document.getElementById("signupForm");
  const message = document.getElementById("message");

  signupForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    const terms =
      document.getElementById("terms").checked;

    // Check terms
    if (!terms) {
      message.textContent =
        "Please agree to the Terms & Community Rules.";
      return;
    }

    // Check passwords
    if (password !== confirmPassword) {
      message.textContent =
        "Passwords do not match.";
      return;
    }

    // Check password length
    if (password.length < 6) {
      message.textContent =
        "Password must be at least 6 characters.";
      return;
    }

    message.textContent =
      "Creating your account...";

    try {

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {
            emailRedirectTo: EMAIL_REDIRECT_URL
          }

        });

      if (error) {
        message.textContent =
          error.message;
        return;
      }

      if (data.user) {

        message.textContent =
          "Account created! Check your email and click the confirmation link.";

        signupForm.reset();
      }

    } catch (error) {

      console.error(error);

      message.textContent =
        "Something went wrong. Please try again.";
    }

  });
</script>

</body>
</html>
