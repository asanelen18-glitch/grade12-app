<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 12 Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #173b73;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      background: #173b73;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0f2b55;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #173b73;
      font-weight: bold;
      text-decoration: none;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .terms {
      margin-top: 15px;
      font-size: 14px;
    }

    .terms input {
      width: auto;
      margin-right: 8px;
    }
  </style>
</head>

<body>

<header>
  <h1>Grade 12 Hub</h1>
  <p>Past Papers • Notes • Motivation • University Applications</p>
</header>

<div class="container">
  <div class="card">

    <h2>Create Account</h2>

    <form id="signupForm">

      <label for="email">Email *</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password *</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm Password *</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="6"
        required
      >

      <div class="terms">
        <label>
          <input type="checkbox" id="terms" required>
          I agree to the Grade 12 Hub Terms & Community Rules.
        </label>
      </div>

      <button type="submit">Create Account</button>

      <div id="message"></div>

    </form>

    <div class="login-link">
      Already have an account?
      <a href="login.html">Log in</a>
    </div>

  </div>
</div>

<script>
  // ==========================================
  // SUPABASE CONNECTION
  // ==========================================

  const SUPABASE_URL = "https://hdlhhbnawltisszzsbvw.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Z3kWBySaIHiFDJdIGFhC_Q_a9SPPRlK";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  // ==========================================
  // CREATE ACCOUNT
  // ==========================================

  const signupForm = document.getElementById("signupForm");
  const message = document.getElementById("message");

  signupForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const terms = document.getElementById("terms").checked;

    message.textContent = "";

    if (!terms) {
      message.textContent = "Please agree to the Terms & Community Rules.";
      return;
    }

    if (password !== confirmPassword) {
      message.textContent = "Passwords do not match.";
      return;
    }

    if (password.length < 6) {
      message.textContent = "Password must be at least 6 characters.";
      return;
    }

    message.textContent = "Creating your account...";

    try {
      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      if (data.user) {
        if (data.session) {
          message.textContent = "Account created successfully!";

          setTimeout(function() {
            window.location.href = "home.html";
          }, 1000);

        } else {
          message.textContent =
            "Account created! Please check your email to confirm your account.";
        }
      }

    } catch (error) {
      message.textContent = "Something went wrong. Please try again.";
      console.error(error);
    }
  });
</script>

</body>
</html>
