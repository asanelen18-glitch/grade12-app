
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Study Planner | Grade 12 Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#202338;font-family:Arial,sans-serif}
header{background:#4f46e5;color:white;padding:20px}
header a{color:white}
main{max-width:850px;margin:auto;padding:18px}
.card{background:white;border-radius:15px;padding:20px;margin-bottom:18px;box-shadow:0 3px 12px #0000000c}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:16px;font-family:inherit}
textarea{min-height:80px}
button{border:0;border-radius:9px;padding:11px 15px;margin:5px 4px 0 0;background:#4f46e5;color:white;font-weight:bold;cursor:pointer}
.secondary{background:#e5e7eb;color:#222}
.delete{background:#b91c1c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.task{padding:15px 0;border-bottom:1px solid #eee}
.task h3{margin:0 0 8px}
.muted{color:#64748b}
.done{text-decoration:line-through;color:#64748b}
.status{padding:10px;background:#eef2ff;border-radius:8px;margin:12px 0}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<a href="index.html">← Back to Grade 12 Hub</a>
<h1>📅 My Study Planner</h1>
<p>Organise exams, tests, assignments and study sessions.</p>
</header>

<main>
<section class="card">
<h2>Add a study plan</h2>
<form id="planForm">
<label for="title">Task name</label>
<input id="title" maxlength="150" required placeholder="e.g. Mathematics Paper 1 revision">

<label for="subject">Subject</label>
<input id="subject" maxlength="100" placeholder="e.g. Mathematics">

<label for="type">Task type</label>
<select id="type">
<option>Study session</option>
<option>Exam</option>
<option>Test</option>
<option>Assignment</option>
<option>Revision</option>
<option>Other</option>
</select>

<div class="grid">
<div>
<label for="planDate">Date</label>
<input id="planDate" type="date" required>
</div>
<div>
<label for="reminder">Reminder</label>
<select id="reminder">
<option value="0">At scheduled time</option>
<option value="5">5 minutes before</option>
<option value="15" selected>15 minutes before</option>
<option value="30">30 minutes before</option>
<option value="60">1 hour before</option>
<option value="1440">1 day before</option>
</select>
</div>
</div>

<div class="grid">
<div>
<label for="startTime">Start time (optional)</label>
<input id="startTime" type="time">
</div>
<div>
<label for="endTime">End time (optional)</label>
<input id="endTime" type="time">
</div>
</div>

<label for="notes">Notes (optional)</label>
<textarea id="notes" maxlength="2000" placeholder="Topics to study or materials to bring"></textarea>

<button type="submit">＋ Save study plan</button>
<button type="button" class="secondary" onclick="enableNotifications()">🔔 Enable reminders</button>
</form>
<div class="status" id="message" role="status">Log in to save your personal planner.</div>
</section>

<section class="card">
<h2>📚 My tasks</h2>
<label for="filter">Filter tasks</label>
<select id="filter" onchange="renderPlans()">
<option value="all">All tasks</option>
<option value="upcoming">Not completed</option>
<option value="completed">Completed</option>
</select>
<div id="planList">Loading your plans...</div>
<button class="secondary" onclick="loadPlans()">↻ Refresh plans</button>
</section>
</main>

<script>
// Use the SAME Supabase URL and public key as your login page.
// Never use the service_role secret in browser code.
const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

let user=null;
let plans=[];
const alertedReminders=new Set();

function message(text){$("message").textContent=text}

function localDateString(date=new Date()){
  const y=date.getFullYear();
  const m=String(date.getMonth()+1).padStart(2,"0");
  const d=String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

$("planDate").min=localDateString();
$("planDate").value=localDateString();

async function initialise(){
  if(SUPABASE_URL.includes("PASTE_")||SUPABASE_KEY.includes("PASTE_")){
    message("Add your existing Supabase URL and public key to this file.");
    return;
  }

  const {data,error}=await db.auth.getSession();
  if(error||!data.session){
    message("Please log in to Grade 12 Hub first.");
    $("planList").textContent="Your plans will appear after you log in.";
    return;
  }

  user=data.session.user;
  message("Your personal planner is ready.");
  await loadPlans();
  checkReminders();
  setInterval(checkReminders,30000);
}

$("planForm").addEventListener("submit",async event=>{
  event.preventDefault();
  if(!user){message("Please log in before saving.");return}

  const title=$("title").value.trim();
  const date=$("planDate").value;
  const start=$("startTime").value||null;
  const end=$("endTime").value||null;

  if(!title||!date){message("Enter a task name and date.");return}
  if(start&&end&&end<=start){
    message("The end time must be later than the start time.");return;
  }

  const {error}=await db.from("study_plans").insert({
    user_id:user.id,
    title,
    subject:$("subject").value.trim(),
    type:$("type").value,
    plan_date:date,
    start_time:start,
    end_time:end,
    notes:$("notes").value.trim(),
    reminder_minutes:Number($("reminder").value),
    completed:false
  });

  if(error){message("Could not save: "+error.message);return}

  $("planForm").reset();
  $("planDate").value=localDateString();
  $("reminder").value="15";
  message("Study plan saved successfully!");
  await loadPlans();
});

async function loadPlans(){
  if(!user)return;

  const {data,error}=await db.from("study_plans")
    .select("*")
    .eq("user_id",user.id)
    .order("plan_date",{ascending:true})
    .order("start_time",{ascending:true});

  if(error){$("planList").textContent="Could not load plans: "+error.message;return}
  plans=data||[];
  renderPlans();
}

function renderPlans(){
  const filter=$("filter").value;
  const visible=plans.filter(p=>{
    if(filter==="upcoming")return !p.completed;
    if(filter==="completed")return p.completed;
    return true;
  });

  const list=$("planList");
  list.replaceChildren();

  if(!visible.length){
    list.textContent="No tasks here yet. Add a study plan above!";
    return;
  }

  visible.forEach(p=>{
    const item=document.createElement("div");
    item.className="task";

    const heading=document.createElement("h3");
    heading.textContent=p.title;
    if(p.completed)heading.className="done";

    const detail=document.createElement("p");
    detail.className="muted";
    detail.textContent=(p.subject||"General")+
      " · "+p.plan_date+" · "+
      (p.start_time?p.start_time.slice(0,5):"Time not set")+
      (p.end_time?"–"+p.end_time.slice(0,5):"");

    const kind=document.createElement("p");
    kind.textContent="Type: "+(p.type||"Study session");

    const notes=document.createElement("p");
    notes.textContent=p.notes||"";

    const status=document.createElement("p");
    status.textContent=p.completed?"✅ Completed":"📝 Not completed";

    const complete=document.createElement("button");
    complete.textContent=p.completed?"Mark incomplete":"✓ Mark completed";
    complete.onclick=()=>setCompleted(p.id,!p.completed);

    const del=document.createElement("button");
    del.className="delete";
    del.textContent="Delete";
    del.onclick=()=>deletePlan(p.id);

    item.append(heading,detail,kind,notes,status,complete,del);
    list.appendChild(item);
  });
}

async function setCompleted(id,completed){
  const {error}=await db.from("study_plans")
    .update({completed})
    .eq("id",id)
    .eq("user_id",user.id);

  if(error){message("Update failed: "+error.message);return}
  message(completed?"Task completed!":"Task marked incomplete.");
  await loadPlans();
}

async function deletePlan(id){
  if(!confirm("Delete this study plan?"))return;

  const {error}=await db.from("study_plans")
    .delete()
    .eq("id",id)
    .eq("user_id",user.id);

  if(error){message("Delete failed: "+error.message);return}
  message("Study plan deleted.");
  await loadPlans();
}

async function enableNotifications(){
  if(!("Notification" in window)){
    message("Notifications are not supported by this browser.");return;
  }

  const permission=await Notification.requestPermission();
  message(permission==="granted"
    ?"Notifications enabled. Keep the planner open for reminders."
    :"Notifications were not enabled.");
  checkReminders();
}

function checkReminders(){
  if(!user||!("Notification" in window)||
     Notification.permission!=="granted")return;

  const now=Date.now();

  plans.forEach(p=>{
    if(p.completed||!p.start_time)return;

    const start=new Date(p.plan_date+"T"+p.start_time).getTime();
    const reminderAt=start-Number(p.reminder_minutes||0)*60000;
    const key=p.id+":"+p.plan_date+":"+p.start_time;

    // Includes reminders set for the exact scheduled time.
    if(now>=reminderAt&&now<=start+30000&&
       !alertedReminders.has(key)){
      alertedReminders.add(key);
      const notification=new Notification("Grade 12 Hub reminder",{
        body:p.title+(p.subject?" — "+p.subject:"")
      });
      notification.onclick=()=>window.focus();
    }
  });
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js")
      .catch(error=>console.error("Service worker:",error));
  });
}

initialise();
</script>
</body>
</html>
