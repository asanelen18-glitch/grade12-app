/* =====================================
   CHECK ADMIN
===================================== */

async function checkAdmin() {

    try {

        const {
            data: {
                user
            }
        } =
            await supabaseClient
                .auth
                .getUser();


        if (!user) {

            window.location.href =
                "login.html";

            return false;
        }


        if (
            user.id !== ADMIN_ID
        ) {

            alert(
                "❌ Administrator access required."
            );

            window.location.href =
                "index.html";

            return false;
        }


        document.getElementById(
            "adminInfo"
        ).textContent =
            "Administrator account: " +
            (
                user.email ||
                "Email unavailable"
            );


        document.getElementById(
            "adminStatus"
        ).textContent =
            "✅ Administrator access confirmed.";


        return true;


    } catch (error) {

        console.error(error);

        alert(
            "❌ Could not verify administrator access."
        );

        window.location.href =
            "index.html";

        return false;
    }

}


/* =====================================
   GET REPORT DETAILS
===================================== */

async function getReportDetails(report) {

    const {
        data: {
            session
        }
    } =
        await supabaseClient
            .auth
            .getSession();


    if (!session) {

        alert(
            "❌ Your login session has expired."
        );

        return null;
    }


    try {

        const response =
            await fetch(
                "https://grade12-app.vercel.app/api/report-details",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            access_token:
                                session.access_token,

                            reporter_id:
                                report.reporter_id,

                            reported_user_id:
                                report.reported_user_id,

                            message_id:
                                report.message_id

                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            console.error(data);

            alert(
                "❌ Could not load student details.\n\n" +
                (
                    data.error ||
                    "Unknown error."
                )
            );

            return null;
        }


        return data;


    } catch (error) {

        console.error(error);

        alert(
            "❌ Could not connect to the report server."
        );

        return null;
    }

}


/* =====================================
   LOAD REPORTS
===================================== */

async function loadReports() {

    const allowed =
        await checkAdmin();


    if (!allowed) return;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("user_reports")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        document.getElementById(
            "reports"
        ).innerHTML =
            `
                <p class="error">
                    ❌ Could not load reports.
                </p>
            `;

        console.error(error);

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        document.getElementById(
            "reports"
        ).innerHTML =
            `
                <p>
                    No reports found.
                </p>
            `;

        return;
    }


    let html = "";


    data.forEach(
        report => {

            html += `

                <div
                    class="report"
                >

                    <h3>
                        📋 Report
                    </h3>


                    <p>
                        <strong>
                            Report ID:
                        </strong><br>

                        ${escapeHTML(
                            report.id
                        )}
                    </p>


                    <p>
                        <strong>
                            ⚠️ Reason:
                        </strong><br>

                        ${escapeHTML(
                            report.reason
                        )}
                    </p>


                    <p>
                        <strong>
                            💬 Report Description:
                        </strong><br>

                        ${escapeHTML(
                            report.description ||
                            "No description"
                        )}
                    </p>


                    <p>
                        <strong>
                            📊 Status:
                        </strong><br>

                        ${escapeHTML(
                            report.status
                        )}
                    </p>


                    <p>
                        <strong>
                            👤 Reporting Student ID:
                        </strong><br>

                        ${escapeHTML(
                            report.reporter_id ||
                            "Not available"
                        )}
                    </p>


                    <p>
                        <strong>
                            🚨 Reported Student ID:
                        </strong><br>

                        ${escapeHTML(
                            report.reported_user_id ||
                            "Not available"
                        )}
                    </p>


                    <p>
                        <strong>
                            📨 Message ID:
                        </strong><br>

                        ${escapeHTML(
                            report.message_id ||
                            "Not available"
                        )}
                    </p>


                    <p>
                        <strong>
                            📅 Date:
                        </strong><br>

                        ${formatDate(
                            report.created_at
                        )}
                    </p>


                    <hr>


                    <div
                        class="details-box"
                        id="details-${escapeHTML(
                            report.id
                        )}"
                    >

                        <p class="loading">
                            🔍 Loading student emails
                            and reported content...
                        </p>

                    </div>


                    <br>


                    <button
                        class="review"
                        onclick="
                            reviewReport(
                                '${report.id}'
                            )
                        "
                    >
                        🔎 Review
                    </button>


                    <button
                        class="warning"
                        onclick="
                            moderationAction(
                                '${report.id}',
                                'warning'
                            )
                        "
                    >
                        ⚠️ Warning
                    </button>


                    <button
                        class="suspend"
                        onclick="
                            moderationAction(
                                '${report.id}',
                                'suspension'
                            )
                        "
                    >
                        ⏸️ Suspend
                    </button>


                    <button
                        class="remove"
                        onclick="
                            moderationAction(
                                '${report.id}',
                                'removal'
                            )
                        "
                    >
                        🚫 Remove
                    </button>


                    <button
                        class="email"
                        onclick="
                            sendEmail(
                                '${report.id}'
                            )
                        "
                    >
                        📧 Send Email
                    </button>

                </div>

            `;

        }
    );


    document.getElementById(
        "reports"
    ).innerHTML =
        html;


    /* =====================================
       LOAD EMAILS AND CONTENT
    ===================================== */

    for (
        const report of data
    ) {

        const details =
            await getReportDetails(
                report
            );


        const box =
            document.getElementById(
                `details-${report.id}`
            );


        if (!box) continue;


        if (!details) {

            box.innerHTML =
                `
                    <p class="error">
                        ❌ Could not load
                        report details.
                    </p>
                `;

            continue;
        }


        let contentHTML = `

            <p>

                <strong>
                    👤 Reporting Student Email:
                </strong>

                <br>

                <span
                    class="email-address"
                >
                    ${escapeHTML(
                        details.reporter_email ||
                        "Email not available"
                    )}
                </span>

            </p>


            <p>

                <strong>
                    🚨 Reported Student Email:
                </strong>

                <br>

                <span
                    class="email-address"
                >
                    ${escapeHTML(
                        details.reported_email ||
                        "Email not available"
                    )}
                </span>

            </p>


            <hr>


            <strong>
                📝 Reported Content
            </strong>

        `;


        const message =
            details.message;


        if (!message) {

            contentHTML += `

                <p>
                    No reported message
                    or attachment was found.
                </p>

            `;

        } else {


            contentHTML += `

                <p>

                    <strong>
                        💬 Message:
                    </strong>

                </p>


                <div
                    class="reported-content"
                >
                    ${escapeHTML(
                        message.message ||
                        "No text message"
                    )}
                </div>

            `;


            if (
                message.attachment_url
            ) {

                const attachmentURL =
                    message.attachment_url;


                const attachmentName =
                    message.attachment_name ||
                    "Reported attachment";


                const lowerURL =
                    attachmentURL.toLowerCase();


                const isImage =
                    lowerURL.includes(
                        ".jpg"
                    ) ||
                    lowerURL.includes(
                        ".jpeg"
                    ) ||
                    lowerURL.includes(
                        ".png"
                    ) ||
                    lowerURL.includes(
                        ".gif"
                    ) ||
                    lowerURL.includes(
                        ".webp"
                    );


                if (isImage) {

                    contentHTML += `

                        <p>

                            <strong>
                                🖼️ Reported Photo:
                            </strong>

                        </p>


                        <img
                            src="${escapeHTML(
                                attachmentURL
                            )}"
                            alt="Reported photo"
                        >


                        <br>


                        <a
                            href="${escapeHTML(
                                attachmentURL
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            🖼️ Open Photo
                        </a>

                    `;

                } else {

                    contentHTML += `

                        <p>

                            <strong>
                                📎 Reported File:
                            </strong>

                            <br>

                            ${escapeHTML(
                                attachmentName
                            )}

                        </p>


                        <a
                            href="${escapeHTML(
                                attachmentURL
                            )}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            📂 Open Reported File
                        </a>

                    `;

                }

            }

        }


        box.innerHTML =
            contentHTML;

    }

}


/* =====================================
   REVIEW REPORT
===================================== */

async function reviewReport(
    reportId
) {

    const allowed =
        await checkAdmin();


    if (!allowed) return;


    const {
        data: report,
        error
    } =
        await supabaseClient
            .from("user_reports")
            .select("*")
            .eq(
                "id",
                reportId
            )
            .single();


    if (
        error ||
        !report
    ) {

        alert(
            "❌ Could not find this report."
        );

        console.error(error);

        return;
    }


    const details =
        await getReportDetails(
            report
        );


    let messageText =
        "No message available.";


    if (
        details &&
        details.message
    ) {

        messageText =
            details.message.message ||
            "No text message.";

    }


    let info =

        "REPORT DETAILS\n\n" +

        "Reason: " +
        report.reason +

        "\n\nDescription: " +
        (
            report.description ||
            "None"
        ) +

        "\n\nReporting student: " +
        (
            details?.reporter_email ||
            "Email not available"
        ) +

        "\n\nReported student: " +
        (
            details?.reported_email ||
            "Email not available"
        ) +

        "\n\nReported message:\n" +
        messageText;


    alert(info);


    if (
        report.status ===
        "pending"
    ) {

        const confirmReview =
            confirm(
                "Mark this report as reviewing?"
            );


        if (!confirmReview)
            return;


        const {
            error: updateError
        } =
            await supabaseClient
                .from("user_reports")
                .update({

                    status:
                        "reviewing"

                })
                .eq(
                    "id",
                    reportId
                );


        if (updateError) {

            alert(
                "❌ Could not update report."
            );

            console.error(
                updateError
            );

            return;
        }


        alert(
            "✅ Report marked as reviewing."
        );


        loadReports();

    }

}


/* =====================================
   MODERATION ACTION
===================================== */

async function moderationAction(
    reportId,
    action
) {

    const allowed =
        await checkAdmin();


    if (!allowed) return;


    const {
        data: report,
        error
    } =
        await supabaseClient
            .from("user_reports")
            .select("*")
            .eq(
                "id",
                reportId
            )
            .single();


    if (
        error ||
        !report
    ) {

        alert(
            "❌ Could not find this report."
        );

        console.error(error);

        return;
    }


    if (
        !report.reported_user_id
    ) {

        alert(
            "❌ No reported student was found."
        );

        return;
    }


    let actionName = "";


    if (
        action ===
        "warning"
    ) {

        actionName =
            "WARNING";

    }


    if (
        action ===
        "suspension"
    ) {

        actionName =
            "SUSPENSION";

    }


    if (
        action ===
        "removal"
    ) {

        actionName =
            "REMOVAL";

    }


    const confirmed =
        confirm(
            "Are you sure you want to apply a " +
            actionName +
            " to this student?"
        );


    if (!confirmed)
        return;


    const reason =
        prompt(
            "Enter the reason for this action:"
        );


    if (!reason)
        return;


    let durationDays =
        null;


    if (
        action ===
        "suspension"
    ) {

        const days =
            prompt(
                "How many days should the suspension last?",
                "7"
            );


        if (!days)
            return;


        durationDays =
            parseInt(
                days,
                10
            );


        if (
            isNaN(
                durationDays
            ) ||
            durationDays <= 0
        ) {

            alert(
                "❌ Please enter a valid number of days."
            );

            return;
        }

    }


    const {
        error: actionError
    } =
        await supabaseClient
            .from(
                "moderation_actions"
            )
            .insert({

                user_id:
                    report.reported_user_id,

                report_id:
                    report.id,

                action:
                    action,

                reason:
                    reason,

                duration_days:
                    durationDays

            });


    if (actionError) {

        alert(
            "❌ Could not save moderation action."
        );

        console.error(
            actionError
        );

        return;
    }


    const {
        data: currentStatus,
        error: statusError
    } =
        await supabaseClient
            .from(
                "user_moderation_status"
            )
            .select("*")
            .eq(
                "user_id",
                report.reported_user_id
            )
            .maybeSingle();


    if (statusError) {

        console.error(
            statusError
        );

    }


    let warningCount =
        currentStatus?.warning_count ||
        0;


    let isSuspended =
        currentStatus?.is_suspended ||
        false;


    let isRemoved =
        currentStatus?.is_removed ||
        false;


    let suspendedUntil =
        currentStatus?.suspended_until ||
        null;


    if (
        action ===
        "warning"
    ) {

        warningCount++;

    }


    if (
        action ===
        "suspension"
    ) {

        isSuspended =
            true;


        const until =
            new Date();


        until.setDate(
            until.getDate() +
            durationDays
        );


        suspendedUntil =
            until.toISOString();

    }


    if (
        action ===
        "removal"
    ) {

        isRemoved =
            true;

    }


    const {
        error: upsertError
    } =
        await supabaseClient
            .from(
                "user_moderation_status"
            )
            .upsert({

                user_id:
                    report.reported_user_id,

                warning_count:
                    warningCount,

                is_suspended:
                    isSuspended,

                is_removed:
                    isRemoved,

                suspended_until:
                    suspendedUntil,

                last_action_at:
                    new Date().toISOString(),

                updated_at:
                    new Date().toISOString()

            });


    if (upsertError) {

        alert(
            "⚠️ Action was saved, but moderation status could not be updated."
        );

        console.error(
            upsertError
        );

        return;
    }


    const {
        error: reportError
    } =
        await supabaseClient
            .from(
                "user_reports"
            )
            .update({

                status:
                    "confirmed",

                reviewed_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                reportId
            );


    if (reportError) {

        alert(
            "⚠️ Moderation action saved, but report status could not be updated."
        );

        console.error(
            reportError
        );

        return;
    }


    alert(
        "✅ " +
        actionName +
        " applied successfully."
    );


    loadReports();

}


/* =====================================
   SEND EMAIL
===================================== */

async function sendEmail(
    reportId
) {

    const allowed =
        await checkAdmin();


    if (!allowed)
        return;


    const {
        data: report,
        error
    } =
        await supabaseClient
            .from(
                "user_reports"
            )
            .select("*")
            .eq(
                "id",
                reportId
            )
            .single();


    if (
        error ||
        !report
    ) {

        alert(
            "❌ Could not find this report."
        );

        console.error(error);

        return;
    }


    const details =
        await getReportDetails(
            report
        );


    if (!details) {
        return;
    }


    const reportedEmail =
        details.reported_email;


    const reporterEmail =
        details.reporter_email;


    if (
        !reportedEmail ||
        reportedEmail ===
        "Email not available"
    ) {

        alert(
            "❌ The reported student's email is not available."
        );

        return;
    }


    const choice =
        prompt(
            "Who do you want to email?\n\n" +
            "1 = Reported student\n" +
            "2 = Reporting student\n\n" +
            "Enter 1 or 2:",
            "1"
        );


    if (
        choice !== "1" &&
        choice !== "2"
    ) {

        alert(
            "❌ Please enter 1 or 2."
        );

        return;
    }


    let email;


    if (
        choice === "1"
    ) {

        email =
            reportedEmail;

    } else {

        email =
            reporterEmail;

    }


    if (
        !email ||
        email ===
        "Email not available"
    ) {

        alert(
            "❌ This student's email is not available."
        );

        return;
    }


    const subject =
        prompt(
            "Enter the email subject:",
            "Grade 12 Hub - Important Notice"
        );


    if (!subject)
        return;


    const message =
        prompt(
            "Enter the message you want to send:"
        );


    if (!message)
        return;


    const confirmed =
        confirm(

            "Send this email?\n\n" +

            "To: " +
            email +

            "\n\nSubject: " +
            subject +

            "\n\nMessage:\n" +
            message

        );


    if (!confirmed)
        return;


    try {

        const response =
            await fetch(
                "https://grade12-app.vercel.app/api/send-email",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            to:
                                email,

                            subject:
                                subject,

                            message:
                                message

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            console.error(data);

            alert(

                "❌ Email could not be sent.\n\n" +

                (
                    data.error ||
                    "Unknown error."
                )

            );

            return;
        }


        alert(
            "✅ Email sent successfully!"
        );


    } catch (error) {

        console.error(error);

        alert(
            "❌ Could not connect to the email server."
        );

    }

}

/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================
   FORMAT DATE
===================================== */

function formatDate(
    date
) {

    if (!date)
        return "Unknown";


    try {

        return new Date(
            date
        ).toLocaleString();

    } catch {

        return date;

    }

}
