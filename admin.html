<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://hdlhhbnawltisszzsbvw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Z3kWBySaIHiFDJdIGFhC_Q_a9SPPRlK";


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const ADMIN_ID =
    "a11226b7-7463-497f-9e90-837d6ec16d60";


const REPORT_DETAILS_URL =
    "https://grade12-app.vercel.app/api/report-details";


const SEND_EMAIL_URL =
    "https://grade12-app.vercel.app/api/send-email";



/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin() {

    try {

        const {
            data: {
                session
            }
        } =
            await supabase.auth.getSession();


        if (!session) {

            window.location.href =
                "login.html";

            return false;
        }


        if (
            session.user.id !==
            ADMIN_ID
        ) {

            alert(
                "Administrator access required."
            );

            window.location.href =
                "index.html";

            return false;
        }


        document.getElementById(
            "adminEmail"
        ).textContent =
            session.user.email ||
            "Admin";


        return true;

    } catch (error) {

        console.error(
            "Admin check error:",
            error
        );

        alert(
            "Could not verify administrator access."
        );

        return false;
    }
}



/* =====================================================
   GET REPORT DETAILS
===================================================== */

async function getReportDetails(report) {

    try {

        const {
            data: {
                session
            }
        } =
            await supabase.auth.getSession();


        if (
            !session ||
            !session.access_token
        ) {

            alert(
                "Your login session has expired. Please log in again."
            );

            return null;
        }


        const response =
            await fetch(
                REPORT_DETAILS_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        access_token:
                            session.access_token,

                        reporter_id:
                            report.reporter_id,

                        reported_user_id:
                            report.reported_user_id,

                        message_id:
                            report.message_id

                    })
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            alert(
                result.error ||
                "Could not load report details."
            );

            return null;
        }


        return result;

    } catch (error) {

        console.error(
            "Report details error:",
            error
        );

        alert(
            "Could not connect to the secure report system.\n\n" +
            error.message
        );

        return null;
    }
}



/* =====================================================
   LOAD REPORTS
===================================================== */

async function loadReports() {

    const allowed =
        await checkAdmin();


    if (!allowed) {
        return;
    }


    const container =
        document.getElementById(
            "reportsContainer"
        );


    container.innerHTML =
        '<div class="loading">Loading reports...</div>';


    try {

        const {
            data,
            error
        } =
            await supabase
                .from("user_reports")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            console.error(error);

            container.innerHTML =
                '<div class="error">' +
                escapeHTML(
                    error.message
                ) +
                '</div>';

            return;
        }


        if (
            !data ||
            data.length === 0
        ) {

            container.innerHTML =
                '<div class="empty">' +
                '✅ No reports found.' +
                '</div>';

            return;
        }


        container.innerHTML = "";


        for (
            const report of data
        ) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "report-card";


            const detailsId =
                "details-" +
                report.id;


            card.innerHTML = `

                <h3>
                    🚨 Report
                </h3>

                <div class="report-info">
                    <strong>Report ID:</strong>
                    ${escapeHTML(report.id)}
                </div>

                <div class="report-info">
                    <strong>Reason:</strong>
                    ${escapeHTML(report.reason)}
                </div>

                <div class="report-info">
                    <strong>Description:</strong>
                    ${escapeHTML(
                        report.description ||
                        "No description"
                    )}
                </div>

                <div class="report-info">
                    <strong>Reported User:</strong>
                    ${escapeHTML(
                        report.reported_user_id ||
                        "Not available"
                    )}
                </div>

                <div class="report-info">
                    <strong>Date:</strong>
                    ${formatDate(
                        report.created_at
                    )}
                </div>

                <div class="report-info">
                    <strong>Status:</strong>

                    <span class="report-status">
                        ${escapeHTML(
                            report.status
                        )}
                    </span>
                </div>


                <div
                    id="${detailsId}"
                    class="details-box"
                >
                    Loading secure details...
                </div>


                <div class="button-row">

                    <button
                        class="action-button review"
                        onclick="reviewReport('${report.id}')"
                    >
                        🔎 Review
                    </button>


                    <button
                        class="action-button warning"
                        onclick="moderationAction(
                            '${report.id}',
                            'warning'
                        )"
                    >
                        ⚠️ Warning
                    </button>


                    <button
                        class="action-button suspend"
                        onclick="moderationAction(
                            '${report.id}',
                            'suspension'
                        )"
                    >
                        ⏸️ Suspend
                    </button>


                    <button
                        class="action-button remove"
                        onclick="moderationAction(
                            '${report.id}',
                            'removal'
                        )"
                    >
                        🚫 Remove
                    </button>


                    <button
                        class="action-button email"
                        onclick="sendEmail('${report.id}')"
                    >
                        📧 Send Email
                    </button>

                </div>

            `;


            container.appendChild(card);


            /* Load details */

            getReportDetails(report)
                .then(details => {

                    const box =
                        document.getElementById(
                            detailsId
                        );


                    if (!box) {
                        return;
                    }


                    if (!details) {

                        box.innerHTML =
                            "Could not load secure details.";

                        return;
                    }


                    let html = "";


                    html += `
                        <strong>
                            Reporting student email:
                        </strong>

                        ${escapeHTML(
                            details.reporter_email ||
                            "Not available"
                        )}

                        <br><br>
                    `;


                    html += `
                        <strong>
                            Reported student email:
                        </strong>

                        ${escapeHTML(
                            details.reported_email ||
                            "Not available"
                        )}

                        <br><br>
                    `;


                    if (
                        details.message
                    ) {

                        html += `
                            <strong>
                                Reported message:
                            </strong>

                            <div class="message-content">
                                ${escapeHTML(
                                    details.message.message ||
                                    ""
                                )}
                            </div>
                        `;


                        if (
                            details.message.file_url
                        ) {

                            html += `
                                <p>
                                    <strong>
                                        Attachment:
                                    </strong>
                                </p>

                                <a
                                    href="${escapeHTML(
                                        details.message.file_url
                                    )}"
                                    target="_blank"
                                    rel="noopener"
                                >
                                    Open attachment
                                </a>
                            `;
                        }
                    }


                    box.innerHTML =
                        html;

                });

        }

    } catch (error) {

        console.error(
            "Load reports error:",
            error
        );

        container.innerHTML =
            '<div class="error">' +
            escapeHTML(
                error.message
            ) +
            '</div>';
    }
}



/* =====================================================
   REVIEW REPORT
===================================================== */

async function reviewReport(
    reportId
) {

    const allowed =
        await checkAdmin();


    if (!allowed) {
        return;
    }


    try {

        const {
            data: report,
            error
        } =
            await supabase
                .from("user_reports")
                .select("*")
                .eq(
                    "id",
                    reportId
                )
                .single();


        if (error || !report) {

            alert(
                "Could not load report."
            );

            return;
        }


        const details =
            await getReportDetails(
                report
            );


        if (!details) {
            return;
        }


        let messageText =
            "Report review\n\n";


        messageText +=
            "Reason: " +
            report.reason +
            "\n\n";


        messageText +=
            "Description: " +
            (
                report.description ||
                "None"
            ) +
            "\n\n";


        messageText +=
            "Reporting email: " +
            (
                details.reporter_email ||
                "Not available"
            ) +
            "\n\n";


        messageText +=
            "Reported email: " +
            (
                details.reported_email ||
                "Not available"
            );


        alert(
            messageText
        );


        if (
            report.status ===
            "pending"
        ) {

            const markReviewing =
                confirm(
                    "Mark this report as reviewing?"
                );


            if (
                markReviewing
            ) {

                await supabase
                    .from(
                        "user_reports"
                    )
                    .update({
                        status:
                            "reviewing"
                    })
                    .eq(
                        "id",
                        reportId
                    );


                await loadReports();
            }
        }

    } catch (error) {

        console.error(error);

        alert(
            "Could not review report."
        );
    }
}



/* =====================================================
   MODERATION ACTION
===================================================== */

async function moderationAction(
    reportId,
    action
) {

    const allowed =
        await checkAdmin();


    if (!allowed) {
        return;
    }


    try {

        const {
            data: report,
            error
        } =
            await supabase
                .from("user_reports")
                .select("*")
                .eq(
                    "id",
                    reportId
                )
                .single();


        if (
            error ||
            !report
        ) {

            alert(
                "Could not load report."
            );

            return;
        }


        if (
            !report.reported_user_id
        ) {

            alert(
                "This report does not contain a reported user."
            );

            return;
        }


        let actionName =
            action;


        if (
            action ===
            "warning"
        ) {

            actionName =
                "Warning";

        } else if (
            action ===
            "suspension"
        ) {

            actionName =
                "Suspension";

        } else if (
            action ===
            "removal"
        ) {

            actionName =
                "Removal";
        }


        const confirmed =
            confirm(
                "Are you sure you want to apply:\n\n" +
                actionName +
                "\n\n" +
                "to this user?"
            );


        if (!confirmed) {
            return;
        }


        const reason =
            prompt(
                "Enter the reason for this action:"
            );


        if (
            !reason ||
            !reason.trim()
        ) {

            alert(
                "A reason is required."
            );

            return;
        }


        let durationDays =
            null;


        if (
            action ===
            "suspension"
        ) {

            const duration =
                prompt(
                    "How many days should the suspension last?"
                );


            durationDays =
                parseInt(
                    duration,
                    10
                );


            if (
                isNaN(
                    durationDays
                ) ||
                durationDays <= 0
            ) {

                alert(
                    "Please enter a valid number of days."
                );

                return;
            }
        }


        /* Save moderation action */

        const {
            error:
                actionError
        } =
            await supabase
                .from(
                    "moderation_actions"
                )
                .insert({

                    user_id:
                        report.reported_user_id,

                    report_id:
                        report.id,

                    action:
                        action,

                    reason:
                        reason.trim(),

                    duration_days:
                        durationDays

                });


        if (
            actionError
        ) {

            alert(
                "Could not save moderation action:\n\n" +
                actionError.message
            );

            return;
        }


        /* Get current status */

        const {
            data:
                currentStatus
        } =
            await supabase
                .from(
                    "user_moderation_status"
                )
                .select("*")
                .eq(
                    "user_id",
                    report.reported_user_id
                )
                .maybeSingle();


        let status = {

            user_id:
                report.reported_user_id,

            warning_count:
                currentStatus?.warning_count ||
                0,

            is_suspended:
                currentStatus?.is_suspended ||
                false,

            is_removed:
                currentStatus?.is_removed ||
                false,

            suspended_until:
                currentStatus?.suspended_until ||
                null,

            last_action_at:
                new Date().toISOString(),

            updated_at:
                new Date().toISOString()

        };


        if (
            action ===
            "warning"
        ) {

            status.warning_count += 1;
        }


        if (
            action ===
            "suspension"
        ) {

            const until =
                new Date();


            until.setDate(
                until.getDate() +
                durationDays
            );


            status.is_suspended =
                true;


            status.suspended_until =
                until.toISOString();
        }


        if (
            action ===
            "removal"
        ) {

            status.is_removed =
                true;
        }


        const {
            error:
                statusError
        } =
            await supabase
                .from(
                    "user_moderation_status"
                )
                .upsert(
                    status
                );


        if (
            statusError
        ) {

            alert(
                "Moderation action was recorded, but status could not be updated:\n\n" +
                statusError.message
            );

            return;
        }


        await supabase
            .from(
                "user_reports"
            )
            .update({
                status:
                    "confirmed",

                reviewed_at:
                    new Date().toISOString()
            })
            .eq(
                "id",
                reportId
            );


        alert(
            "✅ " +
            actionName +
            " applied successfully."
        );


        await loadReports();

    } catch (error) {

        console.error(
            "Moderation error:",
            error
        );

        alert(
            "Moderation action failed:\n\n" +
            error.message
        );
    }
}



/* =====================================================
   SEND EMAIL
===================================================== */

async function sendEmail(
    reportId
) {

    try {

        const allowed =
            await checkAdmin();


        if (!allowed) {
            return;
        }


        /* Get report */

        const {
            data: report,
            error: reportError
        } =
            await supabase
                .from(
                    "user_reports"
                )
                .select("*")
                .eq(
                    "id",
                    reportId
                )
                .single();


        if (
            reportError ||
            !report
        ) {

            alert(
                "Could not load the report.\n\n" +
                (
                    reportError?.message ||
                    "Report not found."
                )
            );

            return;
        }


        /* Get secure student details */

        const details =
            await getReportDetails(
                report
            );


        if (!details) {
            return;
        }


        const reporterEmail =
            details.reporter_email &&
            details.reporter_email !==
                "Email not available"
                ? details.reporter_email
                : null;


        const reportedEmail =
            details.reported_email &&
            details.reported_email !==
                "Email not available"
                ? details.reported_email
                : null;


        if (
            !reporterEmail &&
            !reportedEmail
        ) {

            alert(
                "No student email address was found for this report."
            );

            return;
        }


        /* Choose recipient */

        let recipient = null;


        if (
            reporterEmail &&
            reportedEmail
        ) {

            const choice =
                prompt(
                    "Who should receive the email?\n\n" +
                    "1 = Reporting student\n" +
                    "2 = Reported student\n\n" +
                    "Enter 1 or 2:"
                );


            if (
                choice ===
                "1"
            ) {

                recipient =
                    reporterEmail;

            } else if (
                choice ===
                "2"
            ) {

                recipient =
                    reportedEmail;

            } else {

                alert(
                    "Email cancelled."
                );

                return;
            }

        } else {

            recipient =
                reporterEmail ||
                reportedEmail;
        }


        /* Subject */

        const subject =
            prompt(
                "Enter the email subject:"
            );


        if (
            !subject ||
            !subject.trim()
        ) {

            alert(
                "Email cancelled."
            );

            return;
        }


        /* Message */

        const message =
            prompt(
                "Enter the email message:"
            );


        if (
            !message ||
            !message.trim()
        ) {

            alert(
                "Email cancelled."
            );

            return;
        }


        /* Confirmation */

        const confirmed =
            confirm(
                "Send this email?\n\n" +

                "To: " +
                recipient +

                "\n\nSubject: " +
                subject +

                "\n\nMessage:\n" +
                message
            );


        if (!confirmed) {
            return;
        }


        /* Get current session */

        const {
            data: {
                session
            }
        } =
            await supabase.auth.getSession();


        if (
            !session ||
            !session.access_token
        ) {

            alert(
                "Your admin login session has expired. Please log in again."
            );

            return;
        }


        /* Send to secure Vercel endpoint */

        const response =
            await fetch(
                SEND_EMAIL_URL,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            access_token:
                                session.access_token,

                            to:
                                recipient,

                            subject:
                                subject.trim(),

                            message:
                                message.trim()

                        })
                }
            );


        const result =
            await response.json();


        if (
            !response.ok
        ) {

            alert(
                "❌ Email could not be sent.\n\n" +
                (
                    result.error ||
                    "The email server returned an error."
                )
            );

            return;
        }


        alert(
            "✅ Email sent successfully!\n\n" +
            "To: " +
            recipient
        );


    } catch (error) {

        console.error(
            "Send email error:",
            error
        );


        alert(
            "❌ Email failed.\n\n" +
            (
                error.message ||
                "Unknown error occurred."
            )
        );
    }
}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}



/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
    value
) {

    if (!value) {
        return "Unknown";
    }


    try {

        return new Date(
            value
        ).toLocaleString();

    } catch {

        return value;
    }
}
